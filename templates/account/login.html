{% extends "fragments/layout.html" %}
{% block content %}
<h1>Log in</h1>
{% if error %}
  <!-- T7 [A05] reflected cross-site scripting in the error message -------
       The message contains the submitted username and is rendered with
       |safe. -->
  <p class="error">{{ error|safe }}</p>
{% endif %}
<form method="post">
  <label>Username <input name="username" value="alice"></label>
  <label>Password <input type="password" name="password"></label>
  <button type="submit">Log in</button>
</form>
<p class="hint">Training accounts: alice, bob, carol, adminjoe — password Password123</p>
{% endblock %}
